name: Inspect Windows Firefox viewport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-firefox-bridge-diagnostics.yml'
      - 'scripts/gamebrowser-firefox-bridge-diagnostic.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport:
    if: github.repository == 'MultilancerNG/GameBrowser'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Prepare exact pinned Firefox engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'gamebrowser-firefox-viewport'
          New-Item -ItemType Directory -Force $downloadRoot | Out-Null
          gh release download aliasmode-runtime-156.0.1-beta.36-r14 --repo aliasmode/aliasmode-firefox --pattern 'aliasmode-156.0.1-beta.36-win.x86_64.zip' --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Firefox archive download failed' }
          $archive = Join-Path $downloadRoot 'aliasmode-156.0.1-beta.36-win.x86_64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '23d2531f5a72dbfde049319259bcee55407a2ba7afc570398446da5c1f20cfcb') { throw 'Pinned archive checksum mismatch' }
          $engineRoot = Join-Path $downloadRoot 'engine'
          Expand-Archive $archive $engineRoot
          $executables = @(Get-ChildItem $engineRoot -Recurse -File -Filter aliasmode.exe)
          if ($executables.Count -ne 1) { throw 'Expected one pinned native executable' }
          $expectedExecutable = '1a031ad448359f65b299634dd6fd0027c556f4c7807c2e0fb17f48a76fba7337'
          if ((Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedExecutable) { throw 'Pinned executable checksum mismatch' }
          python scripts/firefox-extension-ui-patch.py $engineRoot patches/firefox-extension-ui/original | Set-Content artifacts/firefox-patch.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Exact installed Firefox actor patch failed' }
          if ((Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedExecutable) { throw 'Actor patch changed the native executable' }
          "ALIASMODE_FIREFOX_BINARY_PATH=$($executables[0].FullName)" >> $env:GITHUB_ENV
          "ALIASMODE_FIREFOX_BINARY_SHA256=$expectedExecutable" >> $env:GITHUB_ENV
      - name: Probe actual Firefox geometry and viewport protocol
        run: bun scripts/gamebrowser-firefox-bridge-diagnostic.ts artifacts/firefox-bridge-diagnostic.json
      - name: Retain private detailed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamebrowser-firefox-viewport-diagnostic
          path: artifacts/firefox-*.json
          if-no-files-found: ignore
