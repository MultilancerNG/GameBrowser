name: Cancel superseded task candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-task-ci-cleanup.yml']
  workflow_dispatch:
permissions:
  actions: write
jobs:
  cleanup:
    if: github.repository == 'MultilancerNG/GameBrowser'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the recorded superseded task build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_REPO -cne 'MultilancerNG/GameBrowser') { throw 'Unexpected cleanup repository' }
          $runId = '43550175110'
          $run = gh api "repos/$env:GH_REPO/actions/runs/$runId" | ConvertFrom-Json -Depth 30
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne '068978ce0a7f975630f630479e02194b4cbc3243' -or
              $run.path -cne '.github/workflows/windows.yml' -or $run.event -cne 'push' -or $run.head_branch -cne 'v0.1.0-beta.83') {
            throw 'Exact superseded task-run identity guard failed'
          }
          $cancelled = $false
          if ($run.status -cne 'completed') {
            gh run cancel $runId
            if ($LASTEXITCODE -ne 0) { throw 'Exact superseded task-run cancellation failed' }
            $cancelled = $true
          }
          Write-Output "::notice title=Superseded task candidate::run=$runId cancelRequested=$cancelled previousStatus=$($run.status)"
